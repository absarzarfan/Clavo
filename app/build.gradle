apply plugin: 'com.android.application'
apply plugin: 'kotlin-android'
apply plugin: 'kotlin-kapt'
apply plugin: "androidx.navigation.safeargs"

// ---- Informasi versi (Round 9) ----
// versionName = <skema>+<GIT_SHA>; terbaca lewat `adb shell dumpsys package <paket>`.
// Bila git tidak tersedia: "tidak-diketahui" dan build tetap jalan. -PclavoGitSha=... mengganti
// hasil git (dipakai tools/bangun_varian.ps1 karena skrip itu sementara mengubah assets/models).
def clavoVersionScheme = "1.3.0-ta"
def clavoGit = { List<String> args ->
    try {
        def p = (["git"] + args).execute(null, rootProject.projectDir)
        def out = new StringBuilder()
        p.consumeProcessOutput(out, new StringBuilder())
        p.waitFor()
        return p.exitValue() == 0 ? out.toString().trim() : null
    } catch (Exception ignored) {
        return null
    }
}
def clavoGitSha = project.findProperty("clavoGitSha")
if (!clavoGitSha) {
    def sha = clavoGit(["rev-parse", "--short", "HEAD"])
    if (sha) {
        def dirty = clavoGit(["status", "--porcelain"])
        clavoGitSha = (dirty != null && !dirty.isEmpty()) ? sha + "-dirty" : sha
    } else {
        clavoGitSha = "tidak-diketahui"
    }
}
def clavoBuildTime = new Date().format("yyyy-MM-dd HH:mm")

android {
    compileSdkVersion 34
    defaultConfig {
        testInstrumentationRunner "androidx.test.runner.AndroidJUnitRunner"
        applicationId "com.google.mediapipe.examples.objectdetection"
        minSdkVersion 24
        targetSdkVersion 33
        versionCode 2
        versionName "${clavoVersionScheme}+${clavoGitSha}"
        buildConfigField "String", "GIT_SHA", "\"${clavoGitSha}\""
        buildConfigField "String", "BUILD_TIME", "\"${clavoBuildTime}\""

    }

    dataBinding {
        enabled = true
    }

    compileOptions {
        sourceCompatibility rootProject.ext.java_version
        targetCompatibility rootProject.ext.java_version
    }

    kotlinOptions {
        jvmTarget = rootProject.ext.java_version
    }

    buildTypes {
        release {
            minifyEnabled false
            proguardFiles getDefaultProguardFile('proguard-android.txt'), 'proguard-rules.pro'

            debuggable true
            minifyEnabled false
        }
    }

    buildFeatures {
        viewBinding true
        buildConfig true
    }
    androidResources {
        noCompress 'tflite'
    }
    namespace 'com.google.mediapipe.examples.objectdetection'

}

// Dipakai tools/bangun_varian.ps1: ./gradlew -q printVersionInfo
tasks.register("printVersionInfo") {
    def info = "versionName=${clavoVersionScheme}+${clavoGitSha}"
    doLast { println info }
}

dependencies {
    // Kotlin lang
    implementation 'androidx.core:core-ktx:1.6.0'
    implementation "org.jetbrains.kotlin:kotlin-stdlib-jdk8:$kotlin_version"
    implementation 'org.jetbrains.kotlinx:kotlinx-coroutines-android:1.5.0'

    // App compat and UI things
    implementation 'androidx.appcompat:appcompat:1.3.1'
    implementation 'androidx.lifecycle:lifecycle-runtime-ktx:2.3.1'
    implementation 'androidx.constraintlayout:constraintlayout:2.0.4'
    implementation 'com.google.android.material:material:1.0.0'
    implementation 'androidx.localbroadcastmanager:localbroadcastmanager:1.0.0'
    implementation 'androidx.fragment:fragment-ktx:1.5.4'
    implementation 'com.google.ai.edge.litert:litert:1.2.0'

    // Navigation library
    def nav_version = "2.3.5"
    implementation "androidx.navigation:navigation-fragment-ktx:$nav_version"
    implementation "androidx.navigation:navigation-ui-ktx:$nav_version"

    // CameraX core library
    def camerax_version = '1.1.0'
    implementation "androidx.camera:camera-core:$camerax_version"

    // CameraX Camera2 extensions
    implementation "androidx.camera:camera-camera2:$camerax_version"

    // CameraX Lifecycle library
    implementation "androidx.camera:camera-lifecycle:$camerax_version"

    // CameraX View class
    implementation "androidx.camera:camera-view:$camerax_version"

    //WindowManager
    implementation 'androidx.window:window:1.0.0-alpha09'

    // Unit testing
    testImplementation 'junit:junit:4.13.2'
    testImplementation 'androidx.test.ext:junit:1.1.3'
    testImplementation 'androidx.test:rules:1.4.0'
    testImplementation 'androidx.test:runner:1.4.0'
    testImplementation 'androidx.test.espresso:espresso-core:3.4.0'
    testImplementation 'org.robolectric:robolectric:4.4'

    // Instrumented testing
    androidTestImplementation "androidx.test.ext:junit:1.1.3"
    androidTestImplementation "androidx.test:core:1.4.0"
    androidTestImplementation "androidx.test:rules:1.4.0"
    androidTestImplementation "androidx.test:runner:1.4.0"
    androidTestImplementation "androidx.test.espresso:espresso-core:3.4.0"

    implementation 'com.google.mediapipe:tasks-vision:0.10.32'

    implementation project(':libausbc')

    implementation "androidx.swiperefreshlayout:swiperefreshlayout:1.2.0-alpha01"



}